<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Movies</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e1dc;
    --accent: #c2410c; --chip: #ecebe7; --star: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1f1f22; --text: #f2f2f2; --muted: #9a9aa0; --line: #2e2e33;
            --accent: #fb923c; --chip: #2a2a2e; --star: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 18px 24px 14px; }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input[type=search], select { font: inherit; padding: 7px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); color: var(--text); }
  input[type=search] { width: 240px; }
  .sort { display: flex; gap: 4px; }
  .sort button { font: inherit; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--card); color: var(--text); cursor: pointer; }
  .sort button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid transparent;
          background: var(--chip); color: var(--text); cursor: pointer; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .chip.on { background: var(--accent); color: #fff; }
  .chip.on small { color: rgba(255,255,255,.8); }
  .chip.clear { background: none; border-color: var(--line); color: var(--muted); }
  .hint { color: var(--muted); font-size: 13px; }
  main { padding: 16px 24px 40px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden;
          border: 1px solid var(--line); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.title a { color: var(--text); text-decoration: none; font-weight: 600; }
  td.title a:hover { color: var(--accent); text-decoration: underline; }
  td.folder { color: var(--muted); font-size: 12px; word-break: break-word; max-width: 340px; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rating { font-weight: 700; }
  .rating::before { content: "★ "; color: var(--star); }
  .votes { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .g { display: inline-block; font-size: 12px; padding: 1px 8px; margin: 1px 3px 1px 0; border-radius: 999px;
       background: var(--chip); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) { td.folder, th.folder { display: none; } input[type=search] { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>My Movies <span id="count"></span></h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Search titles…">
    <div class="sort" id="sort">
      <button data-key="rating">IMDb rating</button>
      <button data-key="year">Year</button>
      <button data-key="title">Title</button>
    </div>
    <span class="hint">Click a sort button again to reverse it. Selecting several genres shows films that have all of them.</span>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <table>
    <thead><tr><th>Title</th><th>Year</th><th>IMDb</th><th>Genre</th><th class="folder">Folder</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No movies match these filters.</div>
</main>

const state = { genres: new Set(), sort: 'rating', desc: true, q: '' };
const defaultDesc = { rating: true, year: true, title: false };

const counts = {};
MOVIES.forEach(m => m.genres.forEach(g => counts[g] = (counts[g] || 0) + 1));
const allGenres = Object.keys(counts).sort();

function renderChips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  allGenres.forEach(g => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.genres.has(g) ? ' on' : '');
    b.innerHTML = `${g}<small>${counts[g]}</small>`;
    b.onclick = () => { state.genres.has(g) ? state.genres.delete(g) : state.genres.add(g); render(); };
    el.appendChild(b);
  });
  if (state.genres.size) {
    const c = document.createElement('button');
    c.className = 'chip clear';
    c.textContent = 'Clear genres';
    c.onclick = () => { state.genres.clear(); render(); };
    el.appendChild(c);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

function render() {
  renderChips();
  document.querySelectorAll('#sort button').forEach(b => {
    const on = b.dataset.key === state.sort;
    b.classList.toggle('on', on);
    b.textContent = b.textContent.replace(/ [↑↓]$/, '') + (on ? (state.desc ? ' ↓' : ' ↑') : '');
  });

  const q = state.q.trim().toLowerCase();
  const list = MOVIES.filter(m =>
    [...state.genres].every(g => m.genres.includes(g)) &&
    (!q || m.title.toLowerCase().includes(q) || m.folder.toLowerCase().includes(q)));

  const dir = state.desc ? -1 : 1;
  list.sort((a, b) => {
    let d;
    if (state.sort === 'title') d = a.title.localeCompare(b.title);
    else {
      const av = a[state.sort], bv = b[state.sort];
      if (av == null) return 1;           // unrated always last
      if (bv == null) return -1;
      d = av - bv;
    }
    return d * dir || a.title.localeCompare(b.title);
  });

  document.getElementById('count').textContent =
    list.length === MOVIES.length ? `${MOVIES.length} titles` : `${list.length} of ${MOVIES.length}`;
  document.getElementById('empty').hidden = list.length > 0;
  document.getElementById('rows').innerHTML = list.map(m => `
    <tr>
      <td class="title"><a href="https://www.imdb.com/title/${m.id}/" target="_blank" rel="noopener">${esc(m.title)}</a></td>
      <td class="num">${m.year ?? ''}</td>
      <td class="num">${m.rating != null ? `<span class="rating">${m.rating.toFixed(1)}</span><span class="votes">${m.votes.toLocaleString()}</span>` : '—'}</td>
      <td>${m.genres.map(g => `<span class="g">${esc(g)}</span>`).join('')}</td>
      <td class="folder">${esc(m.folder).replace(/; /g, '<br>')}</td>
    </tr>`).join('');
}

document.querySelectorAll('#sort button').forEach(b => b.onclick = () => {
  const k = b.dataset.key;
  if (state.sort === k) state.desc = !state.desc;
  else { state.sort = k; state.desc = defaultDesc[k]; }
  render();
});
document.getElementById('q').oninput = e => { state.q = e.target.value; render(); };
render();
</script>
